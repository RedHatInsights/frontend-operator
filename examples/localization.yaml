# Localization inputs (API only).
#
# These fields are accepted and stored by the CRDs. They do not by themselves
# make the operator generate locale files, a publisher serve them, or Chrome
# render them.
#
# Both `locales` maps are generated by tooling and are not meant to be
# hand-edited. English is the source language and is never listed.
apiVersion: cloud.redhat.com/v1alpha1
kind: FrontendEnvironment
metadata:
  name: env-localized
spec:
  sso: https://sso.stage.redhat.com/auth
  # Locales that are generated and offered, English included. `id` is the
  # locale identifier (canonical BCP 47 casing), `name` the label shown in the
  # locale picker. Exactly one entry is the `default`.
  enabledLocales:
    - id: en
      name: English
      default: true
    - id: fr
      name: Français
    - id: ko
      name: 한국어
    - id: ja
      name: 日本語
    - id: zh-CN
      name: 简体中文
  bundles:
    - id: rhel
      title: Red Hat Enterprise Linux
  serviceCategories:
    - id: automation
      title: Automation
      groups:
        - id: rhel
          title: Red Hat Enterprise Linux
  # Environment-owned strings (bundle and service category/group titles):
  # locale -> catalog key -> string.
  locales:
    fr:
      bundles.rhel.title: Red Hat Enterprise Linux
      serviceCategories.automation.title: Automatisation
      serviceCategories.automation.groups.rhel.title: Red Hat Enterprise Linux
    ko:
      serviceCategories.automation.title: 자동화
    ja:
      serviceCategories.automation.title: 自動化
    zh-CN:
      serviceCategories.automation.title: 自动化
---
apiVersion: cloud.redhat.com/v1alpha1
kind: Frontend
metadata:
  name: rbac-localized
spec:
  envName: env-localized
  title: RBAC
  deploymentRepo: https://github.com/RedHatInsights/insights-rbac-ui
  frontend:
    paths:
      - /apps/rbac
  module:
    manifestLocation: /apps/rbac/fed-mods.json
    defaultDocumentTitle: User Access
  # Tenant-owned strings: locale -> catalog key -> string.
  # Keys are the YAML-shaped catalog keys, e.g. searchEntries.<id>.title.
  locales:
    fr:
      module.defaultDocumentTitle: Accès utilisateur
      searchEntries.rbac-roles.title: Rôles
      searchEntries.rbac-roles.description: Gérer les rôles et leurs permissions
    ko:
      searchEntries.rbac-roles.title: 역할
    ja:
      searchEntries.rbac-roles.title: ロール
    zh-CN:
      searchEntries.rbac-roles.title: 角色
