apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - image: ${IMAGE}:${IMAGE_TAG}
        name: manager
        args:
        - --leader-elect
        - --log-level=${LOG_LEVEL}
        env:
        - name: PUSHCACHE_AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: ${PUSHCACHE_AWS_SECRET_NAME}
              key: aws-access-key-id
        - name: PUSHCACHE_AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: ${PUSHCACHE_AWS_SECRET_NAME}
              key: aws-secret-access-key
        - name: PUSHCACHE_AWS_BUCKET_NAME
          value: ${PUSHCACHE_AWS_BUCKET_NAME}
        - name: PUSHCACHE_AWS_REGION
          value: ${PUSHCACHE_AWS_REGION}
        - name: PUSHCACHE_AWS_ENDPOINT
          value: ${PUSHCACHE_AWS_ENDPOINT}
        - name: PUSHCACHE_AWS_PORT
          value: ${PUSHCACHE_AWS_PORT}
        - name: GOMEMLIMIT
          value: ${GOMEMLIMIT}
        resources:
          limits:
            cpu: ${CPU_LIMIT}
            memory: ${MEMORY_LIMIT}
          requests:
            cpu: ${CPU_REQUEST}
            memory: ${MEMORY_REQUEST}
