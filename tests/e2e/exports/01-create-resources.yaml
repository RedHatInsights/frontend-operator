---
apiVersion: cloud.redhat.com/v1alpha1
kind: FrontendEnvironment
metadata:
  name: test-exports-environment
spec:
  generateNavJSON: false
  ssl: false
  hostname: foo.redhat.com
  sso: https://sso.foo.redhat.com
  exports:
    - id: export-1
      displayName: My Application
      application: my-app
      resources:
        - id: resource-1
          displayName: Resource One
          resource: /api/v1/exports/resource1
          format:
            - json
            - csv
          filters:
            metric_id: Sockets
            product_id: RHEL for IBM
---
apiVersion: cloud.redhat.com/v1alpha1
kind: Frontend
metadata:
  name: exports-frontend
  namespace: test-exports
spec:
  envName: test-exports-environment
  title: Exports Frontend
  deploymentRepo: https://github.com/RedHatInsights/insights-chrome
  frontend:
    paths:
      - /apps/exports
  image: quay.io/cloudservices/insights-chrome-frontend:720317c
  module:
    manifestLocation: /apps/exports/fed-mods.json
    modules: []
    moduleID: exports
  feoConfigEnabled: true
