---
kind: Secret
apiVersion: v1
metadata:
  name: akamai
  namespace: test-cachebust
data:
  access_token: "bmV3X2FjY2Vzc190b2tlbg=="
  client_secret: "bmV3X2NsaWVudF9zZWNyZXQ="
  client_token: "bmV3X2NsaWVudF90b2tlbg=="
  host: "bmV3X2hvc3Q="
type: Opaque
---
apiVersion: cloud.redhat.com/v1alpha1
kind: FrontendEnvironment
metadata:
  name: test-cachebust-environment
spec:
  generateNavJSON: false
  ssl: false
  hostname: foo.redhat.com
  sso: https://sso.foo.redhat.com
  enableAkamaiCacheBust: true
  akamaiCacheBustImage: "quay.io/rh_ee_addrew/hi_true_bye:add_alias"
  akamaiCacheBustURLs: 
    - "console.doesntexist.redhat.com"
---
apiVersion: cloud.redhat.com/v1alpha1
kind: Frontend
metadata:
  name: chrome-test-filelist
  namespace: test-cachebust
spec:
  API:
    versions:
      - v1
  frontend:
    paths:
      - /
  akamaiCacheBustPaths:
    - /config/chrome/fed-modules.json
    - apps/chrome/index.html
  deploymentRepo: https://github.com/RedHatInsights/insights-chrome
  envName: test-cachebust-environment
  image: quay.io/cloudservices/insights-chrome-frontend:a4ed168
  module:
    config:
      ssoUrl: 'https://'
    manifestLocation: /apps/chrome/js/fed-mods.json
  title: Chrome
---
apiVersion: cloud.redhat.com/v1alpha1
kind: Frontend
metadata:
  name: chrome-test-defaults
  namespace: test-cachebust
spec:
  API:
    versions:
      - v1
  frontend:
    paths:
      - /chrome/defaults
  deploymentRepo: https://github.com/RedHatInsights/insights-chrome
  envName: test-cachebust-environment
  image: quay.io/cloudservices/insights-chrome-frontend:a4ed168
  module:
    config:
      ssoUrl: 'https://'
    manifestLocation: /apps/chrome/js/fed-mods.json
  title: Chrome
---
apiVersion: cloud.redhat.com/v1alpha1
kind: Frontend
metadata:
  name: chrome-test-optout
  namespace: test-cachebust
spec:
  akamaiCacheBustDisable: true
  API:
    versions:
      - v1
  frontend:
    paths:
      - /chrome2
  deploymentRepo: https://github.com/RedHatInsights/insights-chrome
  envName: test-cachebust-environment
  image: quay.io/cloudservices/insights-chrome-frontend:a4ed168
  module:
    config:
      ssoUrl: 'https://'
    manifestLocation: /apps/chrome/js/fed-mods.json
  title: Chrome
