# expect: exactly one enabled locale must be marked as the default
apiVersion: cloud.redhat.com/v1alpha1
kind: FrontendEnvironment
metadata:
  name: two-defaults
spec:
  sso: https://sso.foo.redhat.com
  enabledLocales:
    - id: en
      name: English
      default: true
    - id: fr
      name: Français
      default: true
