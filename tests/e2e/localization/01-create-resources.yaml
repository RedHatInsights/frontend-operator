---
apiVersion: cloud.redhat.com/v1alpha1
kind: FrontendEnvironment
metadata:
  name: test-localization-environment
spec:
  generateNavJSON: false
  ssl: false
  hostname: foo.redhat.com
  sso: https://sso.foo.redhat.com
  targetNamespaces:
    - test-localization-target
  enabledLocales:
    - id: en
      name: English
      default: true
    - id: fr
      name: Français
    - id: zh-CN
      name: 简体中文
  bundles:
    - id: iam
      title: Identity and Access Management
  locales:
    fr:
      bundles.iam.title: Gestion des identités et des accès
---
apiVersion: cloud.redhat.com/v1alpha1
kind: Frontend
metadata:
  name: localization-frontend
  namespace: test-localization
spec:
  envName: test-localization-environment
  title: Localization Frontend
  deploymentRepo: https://github.com/RedHatInsights/insights-chrome
  frontend:
    paths:
      - /apps/localization
  image: quay.io/cloudservices/insights-chrome-frontend:720317c
  module:
    manifestLocation: /apps/localization/fed-mods.json
    modules: []
    moduleID: localization
  feoConfigEnabled: true
  bundleSegments:
    - bundleId: iam
      segmentId: user-access
      position: 100
      navItems:
        - id: access
          title: User Access
          expandable: true
          routes:
            - id: roles
              title: Roles
              href: /iam/user-access/roles
  locales:
    fr:
      module.defaultDocumentTitle: Frontend localisé
      bundleSegments.iam.user-access.navItems.access.routes.roles.title: Rôles
