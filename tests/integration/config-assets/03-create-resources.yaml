apiVersion: cloud.redhat.com/v1alpha1
kind: FrontendEnvironment
metadata:
  name: test-config-assets-environment
spec:
  hostname: foo.redhat.com
  sso: https://sso.foo.redhat.com
  disableContainerDeployments: true
  enableConfigAssets: true
  valpopImage: quay.io/redhat-services-prod/hcc-platex-services-tenant/valpop:latest
---
apiVersion: cloud.redhat.com/v1alpha1
kind: Frontend
metadata:
  name: chrome
  namespace: test-config-assets
spec:
  envName: test-config-assets-environment
  title: Chrome
  deploymentRepo: https://github.com/RedHatInsights/insights-chrome
  feoConfigEnabled: true
  image: quay.io/cloudservices/insights-chrome-frontend:720317c
  service: unused-frontend-service
  frontend:
    paths: [/chrome]
  module:
    manifestLocation: /apps/chrome/js/fed-mods.json
    config:
      publicationTest: initial
