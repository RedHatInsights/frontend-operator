apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      set -eu
      oc apply -f - <<'YAML'
      apiVersion: cloud.redhat.com/v1alpha1
      kind: Frontend
      metadata:
        name: companion
        namespace: test-config-assets
      spec:
        envName: test-config-assets-environment
        title: Companion
        deploymentRepo: https://github.com/RedHatInsights/insights-chrome
        feoConfigEnabled: true
        image: quay.io/cloudservices/insights-chrome-frontend:720317c
        service: unused-frontend-service
        frontend:
          paths: [/companion]
        module:
          manifestLocation: /apps/companion/fed-mods.json
      YAML
      oc -n test-config-assets exec config-assets-check -- python /checks/check.py chrome,companion updated
      oc -n test-config-assets wait --for=condition=complete job/test-config-assets-environment-config-assets --timeout=180s
      # Drain the 10-second completion poll so it cannot mask a missing deletion trigger.
      sleep 20
      oc -n test-config-assets delete frontend chrome --timeout=90s
      oc -n test-config-assets exec config-assets-check -- python /checks/check.py companion
      oc -n test-config-assets wait --for=condition=complete job/test-config-assets-environment-config-assets --timeout=180s
      oc -n test-config-assets delete frontend companion --timeout=90s
      oc -n test-config-assets wait --for=delete job/test-config-assets-environment-config-assets --timeout=90s
      oc -n test-config-assets wait --for=delete configmap/test-config-assets-environment-config-assets --timeout=90s
      oc -n test-config-assets wait --for=delete pods -l job-name=test-config-assets-environment-config-assets --timeout=90s
      oc -n test-config-assets exec config-assets-check -- python /checks/check.py companion
