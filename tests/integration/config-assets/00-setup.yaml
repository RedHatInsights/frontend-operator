apiVersion: v1
kind: Namespace
metadata:
  name: test-config-assets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-assets-minio
  namespace: test-config-assets
spec:
  selector:
    matchLabels:
      app: config-assets-minio
  template:
    metadata:
      labels:
        app: config-assets-minio
    spec:
      containers:
        - name: minio
          image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
          args: [server, /data]
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: config-assets-minio
  namespace: test-config-assets
spec:
  selector:
    app: config-assets-minio
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Secret
metadata:
  name: env-test-config-assets-minio
  namespace: test-config-assets
stringData:
  accessKey: minioadmin
  secretKey: minioadmin
  hostname: config-assets-minio.test-config-assets.svc.cluster.local
  port: '9000'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: config-assets-bucket
  namespace: test-config-assets
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create-bucket
          image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
          command: [/bin/sh, -ec]
          args:
            - |
              until mc alias set local http://config-assets-minio:9000 minioadmin minioadmin; do sleep 2; done
              mc mb --ignore-existing local/frontend-pushcache
              mc anonymous set download local/frontend-pushcache
              # SPA entrypoint, so a missing config file could fall back to HTML.
              echo '<!doctype html><title>spa</title>' | mc pipe --attr "Content-Type=text/html" local/frontend-pushcache/index.html
---
apiVersion: cloud.redhat.com/v1alpha1
kind: FrontendEnvironment
metadata:
  name: test-config-assets
spec:
  hostname: foo.redhat.com
  sso: https://sso.foo.redhat.com
  disableContainerDeployments: true
  valpopImage: quay.io/redhat-services-prod/hcc-platex-services-tenant/valpop:latest
---
apiVersion: cloud.redhat.com/v1alpha1
kind: Frontend
metadata:
  name: chrome
  namespace: test-config-assets
spec:
  envName: test-config-assets
  title: Chrome
  deploymentRepo: https://github.com/RedHatInsights/insights-chrome
  feoConfigEnabled: true
  image: quay.io/cloudservices/insights-chrome-frontend:720317c
  service: unused-frontend-service
  frontend:
    paths: [/chrome]
  module:
    manifestLocation: /apps/chrome/js/fed-mods.json
    config:
      publicationTest: initial
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-assets-check
  namespace: test-config-assets
data:
  check.py: |
    import json, sys, time, urllib.error, urllib.request

    base = 'http://config-assets-minio:9000/frontend-pushcache/data/config/'
    expected = set(sys.argv[1].split(','))
    last_error = 'no response'
    deadline = time.monotonic() + 150
    while time.monotonic() < deadline:
        try:
            with urllib.request.urlopen(base + 'fed-modules.json', timeout=5) as response:
                registry = json.load(response)
                assert set(registry) == expected, registry
                assert response.headers['Cache-Control'] == 'public, max-age=60'
                if len(sys.argv) > 2:
                    assert registry['chrome']['config']['publicationTest'] == sys.argv[2]
            break
        except urllib.error.HTTPError as error:
            if expected == {'absent'} and error.code == 404:
                break
            last_error = str(error)
        except (OSError, ValueError, AssertionError, KeyError) as error:
            last_error = str(error)
        time.sleep(2)
    else:
        raise AssertionError(f'Expected {sys.argv[1:]}: {last_error}')

    for excluded in ['Caddyfile']:
        try:
            with urllib.request.urlopen(base + excluded, timeout=5):
                raise AssertionError(excluded + ' must not be uploaded')
        except urllib.error.HTTPError as error:
            assert error.code == 404
    print('Verified registry, cache headers and exclusions:', sys.argv[1:])
  locales.py: |
    import json, sys, time, urllib.error, urllib.request

    # The operator-managed frontend-asset-proxy for this environment.
    origin = 'http://reverse-proxy:8080'
    base = origin + '/config/'
    expected = set(sys.argv[1].split(','))
    html = {'Accept': 'text/html,application/xhtml+xml'}

    def fetch(url, method='GET', headers=None):
        request = urllib.request.Request(url, method=method, headers=headers or {})
        return urllib.request.urlopen(request, timeout=5)

    def assert_json(response):
        assert response.headers['Cache-Control'] == 'public, max-age=60'
        assert response.headers['Content-Type'].split(';')[0] == 'application/json'

    deadline = time.monotonic() + 150
    last_error = 'no response'
    while time.monotonic() < deadline:
        try:
            with fetch(base + 'locales.json') as response:
                manifest = json.load(response)
                assert {entry['id'] for entry in manifest} == expected, manifest
                assert_json(response)
            for entry in manifest:
                if entry['id'] == 'en':
                    continue
                with fetch(base + entry['file']) as response:
                    messages = json.load(response)
                    assert messages['module.chrome.defaultDocumentTitle'] == sys.argv[2], messages
                    assert_json(response)
            break
        except (OSError, ValueError, AssertionError, KeyError) as error:
            last_error = str(error)
        time.sleep(2)
    else:
        raise AssertionError(f'Locale readback failed: {last_error}')

    # The /apps/config/ alias and HEAD resolve to the same objects.
    with fetch(origin + '/apps/config/locales.json') as response:
        assert json.load(response) == manifest
    for url in [base + 'locales.json', origin + '/apps/config/locales.json']:
        with fetch(url, method='HEAD') as response:
            assert response.status == 200, url

    # Control: SPA fallback is active for application routes...
    with fetch(origin + '/some/app/route', headers=html) as response:
        assert response.headers['Content-Type'].startswith('text/html'), response.headers
    # ...but never answers for missing config, even when a browser asks for HTML.
    for filename in ['messages.missing.json', 'not-published.json']:
        for url in [base + filename, origin + '/apps/config/' + filename]:
            try:
                with fetch(url, headers=html):
                    raise AssertionError(url + ' returned success/SPA HTML')
            except urllib.error.HTTPError as error:
                assert error.code == 404, (url, error.code)
    print('Verified locale assets through frontend-asset-proxy:', sys.argv[1:])
---
apiVersion: v1
kind: Pod
metadata:
  name: config-assets-check
  namespace: test-config-assets
spec:
  containers:
    - name: check
      image: python:3.13-alpine
      command: [sleep, '3600']
      volumeMounts:
        - name: check
          mountPath: /checks
  volumes:
    - name: check
      configMap:
        name: config-assets-check
